<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <!-- Rudův byt (úvod kapitoly 1): skica pozadí v paletě stylové bible (okr, rez, vybledlá
       petrolejová, žluté stavební akcenty, tlusté hnědé obrysy). Chybí jedna stěna (díra vpravo
       od středu), vlevo police s knihou (kniha je zvlášť kulisa byt_kniha.svg), nahoře zeď slávy,
       stůl s hrnkem (hrnek je zvlášť kulisa byt_hrnek.svg), vpravo dveře se škvírou. -->
  <defs>
    <linearGradient id="nebe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb3c8"/>
      <stop offset="1" stop-color="#d6c48a"/>
    </linearGradient>
  </defs>
  <!-- zadní stěna: okrová omítka s panelovými spárami -->
  <rect x="0" y="0" width="1536" height="780" fill="#e3c27a"/>
  <g stroke="#b99352" stroke-width="4" opacity="0.6">
    <line x1="0" y1="260" x2="1536" y2="260"/>
    <line x1="0" y1="520" x2="1536" y2="520"/>
    <line x1="300" y1="0" x2="300" y2="780"/>
    <line x1="780" y1="0" x2="780" y2="780"/>
    <line x1="1160" y1="0" x2="1160" y2="780"/>
  </g>
  <!-- skvrny vlhkosti -->
  <ellipse cx="120" cy="690" rx="90" ry="40" fill="#c9a558" opacity="0.5"/>
  <ellipse cx="1480" cy="120" rx="70" ry="110" fill="#c9a558" opacity="0.5"/>
  <!-- podlaha: ošlapané linoleum s perspektivou -->
  <polygon points="0,780 1536,780 1536,1024 0,1024" fill="#a9794a"/>
  <g stroke="#7a5230" stroke-width="3" opacity="0.7">
    <line x1="0" y1="840" x2="1536" y2="840"/>
    <line x1="0" y1="920" x2="1536" y2="920"/>
    <line x1="200" y1="780" x2="60" y2="1024"/>
    <line x1="520" y1="780" x2="440" y2="1024"/>
    <line x1="860" y1="780" x2="860" y2="1024"/>
    <line x1="1180" y1="780" x2="1280" y2="1024"/>
    <line x1="1440" y1="780" x2="1536" y2="960"/>
  </g>
  <!-- sokl -->
  <rect x="0" y="760" width="1536" height="24" fill="#8a5a30" stroke="#4a2e14" stroke-width="5"/>

  <!-- díra ve zdi (chybějící stěna) s výhledem na město, kometu a skluz na suť -->
  <polygon points="820,300 900,275 1000,290 1070,330 1085,420 1060,520 1075,620 1040,720 960,750 880,735 830,690 800,600 815,500 790,400"
    fill="url(#nebe)" stroke="#4a2e14" stroke-width="8" stroke-linejoin="round"/>
  <clipPath id="vyhled">
    <polygon points="820,300 900,275 1000,290 1070,330 1085,420 1060,520 1075,620 1040,720 960,750 880,735 830,690 800,600 815,500 790,400"/>
  </clipPath>
  <g clip-path="url(#vyhled)">
    <!-- kometa -->
    <line x1="840" y1="330" x2="930" y2="372" stroke="#f3e4c2" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <circle cx="935" cy="374" r="13" fill="#e9b52a" stroke="#4a2e14" stroke-width="3"/>
    <!-- město: rozestavěné paneláky a jeřáb -->
    <rect x="790" y="470" width="90" height="170" fill="#b8b0a0" stroke="#4a2e14" stroke-width="4"/>
    <rect x="900" y="430" width="110" height="210" fill="#cfc3a6" stroke="#4a2e14" stroke-width="4"/>
    <rect x="1020" y="490" width="80" height="150" fill="#b8b0a0" stroke="#4a2e14" stroke-width="4"/>
    <g fill="#3f7d76">
      <rect x="805" y="490" width="18" height="24"/><rect x="840" y="490" width="18" height="24"/>
      <rect x="805" y="540" width="18" height="24"/><rect x="840" y="540" width="18" height="24"/>
      <rect x="915" y="450" width="20" height="26"/><rect x="955" y="450" width="20" height="26"/>
      <rect x="915" y="500" width="20" height="26"/><rect x="955" y="500" width="20" height="26"/>
      <rect x="915" y="550" width="20" height="26"/>
      <rect x="1035" y="510" width="16" height="22"/><rect x="1065" y="510" width="16" height="22"/>
    </g>
    <g stroke="#c9743a" stroke-width="6" fill="none">
      <line x1="1000" y1="640" x2="1000" y2="380"/>
      <line x1="930" y1="380" x2="1085" y2="380"/>
      <line x1="1000" y1="380" x2="1040" y2="420"/>
    </g>
    <line x1="950" y1="380" x2="950" y2="470" stroke="#4a2e14" stroke-width="3"/>
    <!-- suť dole a skluz -->
    <polygon points="780,640 1100,640 1100,760 780,760" fill="#8f8572"/>
    <polygon points="800,700 870,660 920,710 980,670 1040,720 1090,690 1100,760 780,760" fill="#6f6553" stroke="#4a2e14" stroke-width="4"/>
    <polygon points="880,560 1000,580 1100,690 1070,715 980,620 870,600" fill="#e9b52a" stroke="#4a2e14" stroke-width="5"/>
    <g stroke="#4a2e14" stroke-width="3">
      <line x1="905" y1="575" x2="895" y2="600"/><line x1="950" y1="585" x2="940" y2="610"/><line x1="1010" y1="605" x2="1000" y2="630"/>
    </g>
  </g>
  <!-- rozbité okraje díry: cihly a trčící výztuž -->
  <g fill="#c9743a" stroke="#4a2e14" stroke-width="4">
    <rect x="790" y="285" width="60" height="26"/><rect x="1060" y="400" width="52" height="24"/>
    <rect x="778" y="590" width="56" height="26"/><rect x="1050" y="690" width="56" height="26"/>
    <rect x="870" y="740" width="60" height="24"/>
  </g>
  <g stroke="#4a2e14" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M1070,330 q30,-30 60,-10"/>
    <path d="M800,600 q-30,10 -40,40"/>
    <path d="M960,750 q10,30 40,30"/>
  </g>
  <!-- žlutočerná páska před dírou -->
  <g>
    <line x1="760" y1="700" x2="1120" y2="640" stroke="#e9b52a" stroke-width="16"/>
    <line x1="760" y1="700" x2="1120" y2="640" stroke="#4a2e14" stroke-width="16" stroke-dasharray="26 26"/>
  </g>

  <!-- police vlevo: dřevěný regál, prázdný až na jednu knihu (kniha je kulisa) -->
  <rect x="70" y="130" width="200" height="400" fill="#b8884a" stroke="#4a2e14" stroke-width="7"/>
  <g stroke="#4a2e14" stroke-width="6" fill="#8a5a30">
    <rect x="70" y="250" width="200" height="16"/>
    <rect x="70" y="380" width="200" height="16"/>
    <rect x="70" y="512" width="200" height="18"/>
  </g>
  <!-- zaprášené prázdné místo a jedna fotka v rámečku -->
  <rect x="180" y="300" width="60" height="70" fill="#f3e4c2" stroke="#4a2e14" stroke-width="4" transform="rotate(-6 210 335)"/>
  <ellipse cx="210" cy="332" rx="14" ry="16" fill="#c9743a"/>
  <path d="M90,500 q40,-12 80,0 q40,12 80,0" stroke="#d9c4a0" stroke-width="5" fill="none"/>

  <!-- zeď slávy: čtrnáct diplomů (dva řádky), rámeček čtrnáctého chybí, pod nimi Gantt na šest let -->
  <g stroke="#4a2e14" stroke-width="4" fill="#f3e4c2">
    <rect x="350" y="110" width="80" height="60"/><rect x="450" y="110" width="80" height="60"/>
    <rect x="550" y="110" width="80" height="60"/><rect x="650" y="110" width="80" height="60"/>
    <rect x="350" y="190" width="80" height="60"/><rect x="450" y="190" width="80" height="60"/>
    <rect x="550" y="190" width="80" height="60"/><rect x="650" y="190" width="80" height="60"/>
    <rect x="350" y="270" width="80" height="60"/><rect x="450" y="270" width="80" height="60"/>
    <rect x="550" y="270" width="80" height="60"/><rect x="650" y="270" width="80" height="60"/>
    <rect x="350" y="350" width="80" height="60"/>
  </g>
  <!-- malé pečeti a řádky textu na diplomech -->
  <g fill="#c9743a">
    <circle cx="412" cy="158" r="7"/><circle cx="512" cy="158" r="7"/><circle cx="612" cy="158" r="7"/><circle cx="712" cy="158" r="7"/>
    <circle cx="412" cy="238" r="7"/><circle cx="512" cy="238" r="7"/><circle cx="612" cy="238" r="7"/><circle cx="712" cy="238" r="7"/>
    <circle cx="412" cy="318" r="7"/><circle cx="512" cy="318" r="7"/><circle cx="612" cy="318" r="7"/><circle cx="712" cy="318" r="7"/>
    <circle cx="412" cy="398" r="7"/>
  </g>
  <g stroke="#8a7a55" stroke-width="3">
    <line x1="362" y1="128" x2="418" y2="128"/><line x1="462" y1="128" x2="518" y2="128"/><line x1="562" y1="128" x2="618" y2="128"/><line x1="662" y1="128" x2="718" y2="128"/>
    <line x1="362" y1="208" x2="418" y2="208"/><line x1="462" y1="208" x2="518" y2="208"/><line x1="562" y1="208" x2="618" y2="208"/><line x1="662" y1="208" x2="718" y2="208"/>
    <line x1="362" y1="288" x2="418" y2="288"/><line x1="462" y1="288" x2="518" y2="288"/><line x1="562" y1="288" x2="618" y2="288"/><line x1="662" y1="288" x2="718" y2="288"/>
    <line x1="362" y1="368" x2="418" y2="368"/>
  </g>
  <!-- místo pro čtrnáctý: jen hřebík -->
  <circle cx="490" cy="356" r="4" fill="#4a2e14"/>
  <!-- Gantt na výměnu žárovek: jeden řádek, šest let -->
  <rect x="540" y="350" width="190" height="60" fill="#f3e4c2" stroke="#4a2e14" stroke-width="4"/>
  <g stroke="#8a7a55" stroke-width="2">
    <line x1="570" y1="356" x2="570" y2="404"/><line x1="600" y1="356" x2="600" y2="404"/><line x1="630" y1="356" x2="630" y2="404"/>
    <line x1="660" y1="356" x2="660" y2="404"/><line x1="690" y1="356" x2="690" y2="404"/><line x1="720" y1="356" x2="720" y2="404"/>
  </g>
  <rect x="548" y="372" width="176" height="16" fill="#3f7d76" stroke="#4a2e14" stroke-width="2"/>

  <!-- stůl: dřevěná deska na kozách, papíry, bez hrnku (hrnek je kulisa) -->
  <rect x="330" y="600" width="390" height="26" fill="#b8884a" stroke="#4a2e14" stroke-width="6"/>
  <g stroke="#4a2e14" stroke-width="6" fill="#8a5a30">
    <polygon points="360,626 400,626 380,780 340,780"/>
    <polygon points="650,626 690,626 710,780 670,780"/>
  </g>
  <line x1="372" y1="700" x2="690" y2="700" stroke="#4a2e14" stroke-width="5"/>
  <g fill="#f3e4c2" stroke="#4a2e14" stroke-width="3">
    <rect x="560" y="570" width="110" height="34" transform="rotate(-5 615 587)"/>
    <rect x="590" y="580" width="110" height="26" transform="rotate(4 645 593)"/>
    <rect x="350" y="578" width="90" height="26" transform="rotate(3 395 591)"/>
  </g>
  <g stroke="#8a7a55" stroke-width="2">
    <line x1="575" y1="582" x2="650" y2="576"/><line x1="575" y1="592" x2="640" y2="586"/>
    <line x1="362" y1="588" x2="420" y2="590"/>
  </g>

  <!-- telefon s kroucenou šňůrou (úvodní telefonát) -->
  <g transform="translate(26,0)">
  <path d="M452,600 q8,-30 30,-30 h40 q22,0 30,30 z" fill="#3f7d76" stroke="#4a2e14" stroke-width="5" stroke-linejoin="round"/>
  <path d="M446,572 q46,-26 112,0 l-8,12 q-48,-16 -96,0 z" fill="#2f5f59" stroke="#4a2e14" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="502" cy="590" r="9" fill="#f3e4c2" stroke="#4a2e14" stroke-width="3"/>
  <path d="M452,596 q-14,10 -6,20 q8,10 -6,20 q-14,10 -6,20" fill="none" stroke="#4a2e14" stroke-width="4"/>
  </g>

  <!-- dveře vpravo s věřiteli za nimi: rezavě hnědé, klika, pode dveřmi škvíra s obálkami -->
  <rect x="1200" y="230" width="210" height="560" fill="#c9743a" stroke="#4a2e14" stroke-width="8"/>
  <rect x="1225" y="260" width="160" height="200" fill="none" stroke="#4a2e14" stroke-width="5"/>
  <rect x="1225" y="490" width="160" height="260" fill="none" stroke="#4a2e14" stroke-width="5"/>
  <circle cx="1375" cy="500" r="12" fill="#e9b52a" stroke="#4a2e14" stroke-width="4"/>
  <!-- pohyb za dveřmi: čáry otřesů -->
  <g stroke="#4a2e14" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M1425,330 q14,-6 20,-18"/><path d="M1430,360 q16,0 24,-10"/>
    <path d="M1180,330 q-14,-6 -20,-18"/><path d="M1176,360 q-16,0 -24,-10"/>
  </g>
  <!-- škvíra pode dveřmi -->
  <rect x="1200" y="790" width="210" height="14" fill="#2e1b0c"/>
  <g fill="#f3e4c2" stroke="#4a2e14" stroke-width="3">
    <rect x="1215" y="800" width="70" height="30" transform="rotate(-8 1250 815)"/>
    <rect x="1300" y="805" width="80" height="28" transform="rotate(6 1340 819)"/>
    <rect x="1255" y="825" width="76" height="30" transform="rotate(-3 1293 840)"/>
  </g>
  <g stroke="#c9743a" stroke-width="3">
    <line x1="1222" y1="812" x2="1270" y2="806"/><line x1="1310" y1="815" x2="1366" y2="821"/><line x1="1264" y1="838" x2="1318" y2="836"/>
  </g>
  <!-- žárovka na drátu -->
  <line x1="1000" y1="0" x2="1000" y2="120" stroke="#4a2e14" stroke-width="4"/>
  <ellipse cx="1000" cy="140" rx="22" ry="28" fill="#e9b52a" stroke="#4a2e14" stroke-width="4"/>
</svg>
